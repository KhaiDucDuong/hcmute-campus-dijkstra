<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />
  <link rel="shortcut icon" href="./favicon.ico" type="image/x-icon" />
  <link rel="stylesheet" href="./style.css" />
  <title>Dijkstra Solver</title>
  <!-- <script src="./assembly/a.out.js"></script> -->
  <script src="./assembly/dijkstra.js"></script>
</head>

<body onload="load_wasm()">
  <script>
    var dijkstra;
    var pathResult;

    const drawPath = async (pathVector) => {
      pathResult = pathVector;
      let i = pathVector.size() - 1;
      let prevLabel = pathVector.get(i).label;
      while (i > 0) {
        i -= 1;
        const nextLabel = pathVector.get(i).label;
        console.log(`line-${prevLabel}-${nextLabel}`);
        console.log(`line-${nextLabel}-${prevLabel}`);

        const element = document.getElementById(`line-${prevLabel}-${nextLabel}`)
          ? document.getElementById(`line-${prevLabel}-${nextLabel}`)
          : document.getElementById(`line-${nextLabel}-${prevLabel}`);
        console.log(element);
        await wait(1000);
        console.log(element.classList);
        element.classList.remove('line');
        element.classList.add('line-path');
        console.log(element.classList);
        prevLabel = nextLabel;
      }
    };

    const resetPath = () => {
      if (!pathResult) return;
      let i = pathResult.size() - 1;
      let prevLabel = pathResult.get(i).label;
      while (i > 0) {
        i -= 1;
        const nextLabel = pathResult.get(i).label;
        console.log(`line-${prevLabel}-${nextLabel}`);
        console.log(`line-${nextLabel}-${prevLabel}`);

        const element = document.getElementById(`line-${prevLabel}-${nextLabel}`)
          ? document.getElementById(`line-${prevLabel}-${nextLabel}`)
          : document.getElementById(`line-${nextLabel}-${prevLabel}`);
        console.log(element);
        console.log(element.classList);
        element.classList.add('line');
        element.classList.remove('line-path');
        console.log(element.classList);
        prevLabel = nextLabel;
      }
      pathResult = undefined;
    };

    function loadSelectOptions() {
      console.log("Adding options to select elements")
      const srcElement = document.getElementById('src-node');
      const destElement = document.getElementById('dest-node');
      console.log(srcElement);
      console.log(destElement);

      fixedBlocks.forEach((block) => {
        if (block.name) {
          let opt1 = document.createElement('option');
          opt1.value = block.label;
          opt1.innerHTML = block.name;
          srcElement.appendChild(opt1);

          let opt2 = document.createElement('option');
          opt2.value = block.label;
          opt2.innerHTML = block.name;
          destElement.appendChild(opt2);
        }
      });
    }

    function load_wasm() {
      loadSelectOptions();
      console.log("Creating Dijkstra object...");
      dijkstra = new Module.Dijkstra();

      fixedBlocks.forEach((block) => {
        dijkstra.addNode(
          new Module.Node(block.x, block.y, Number(block.label))
        );
      });

      fixedEdges.forEach((edge) => {
        dijkstra.addEdge(new Module.Edge(edge[0], edge[1]));
      });

      console.log("Dijkstra: " + dijkstra.toString());
    }

    function findPath_wasm() {
      const src_label = document.querySelector("#src-node").value;
      const dest_label = document.querySelector("#dest-node").value;

      if (src_label && dest_label) {
        const res = dijkstra.findPath(Number(src_label), Number(dest_label));
        resetPath();
        drawPath(res);
        console.log("Path result: " + res.size());
        let i = res.size();
        while (i > 0) {
          i = i - 1;
          console.log(res.get(i).label + " --> ");
        }
      }
      else {
        console.log("Please select src and dest labels");
      }
    }
  </script>
  <header>
    <div class="title">
      <a href="index.html">Dijkstra Solver</a>
      <a href="./instructions.html"><img src="https://cdn4.iconfinder.com/data/icons/web-mobile1/100/Untitled-8-512.png"
          alt="" /></a>
    </div>
    <div class="options">
      <div>
        <button class="outline-btn" id="add-edge-enable" onclick="addEdges()">
          Add edges
        </button>
        <button class="outline-btn reset-btn" onclick="resetDrawingArea()" disabled>
          Clear
        </button>
      </div>
      <!-- <div>
        <input type="number" inputmode="numeric" id="source-node" placeholder="Source Node" />
        <button class="outline-btn run-btn" onclick="runAlgorithm()" disabled>
          Run
        </button>
      </div> -->
      <div>
        <select id="src-node" style="width: 200px; height: 31.2px;"></select>
        <select id="dest-node" style="width: 200px; height: 31.2px;"></select>
        <button class="outline-btn run-btn" onclick="findPath_wasm()">
          Find Path
        </button>
      </div>
      <div>
        <div id="ret"></div>
      </div>
    </div>
  </header>
  <div class="drawing-area">
    <canvas id="mapCanvas"></canvas>
    <p class="click-instruction">Click to create node</p>
  </div>
  <div class="path"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.3.1/gsap.min.js"></script>
  <script src="./gsap.js"></script>
  <script src="./script.js"></script>
</body>

</html>
