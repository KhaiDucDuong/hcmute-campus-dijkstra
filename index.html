<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="shortcut icon" href="./favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="./style.css" />
    <title>Dijkstra Solver</title>
    <script src="./assembly/a.out.js"></script>
  </head>

  <body>
    <header>
      <div class="title">
        <a href="index.html">Dijkstra Solver</a>
        <a href="./instructions.html"
          ><img
            src="https://cdn4.iconfinder.com/data/icons/web-mobile1/100/Untitled-8-512.png"
            alt=""
        /></a>
      </div>
      <div class="options">
        <div>
          <button class="outline-btn" id="add-edge-enable" onclick="addEdges()">
            Add edges
          </button>
          <button
            class="outline-btn reset-btn"
            onclick="resetDrawingArea()"
            disabled
          >
            Clear
          </button>
        </div>
        <div>
          <input
            type="number"
            inputmode="numeric"
            id="source-node"
            placeholder="Source Node"
          />
          <button class="outline-btn run-btn" onclick="runAlgorithm()" disabled>
            Run
          </button>
        </div>
        <div>
          <script>
            var addNums = Module.cwrap(
              "AddNums",
              "number",
              ["number","number"],
            ) 

            function run_wasm() {
              var result = Module.ccall("main", "number", null, null);
              console.log(result);

              var a = document.querySelector("#a").value;
              var b = document.querySelector("#b").value;
              result = Module.ccall(
                "AddNums",
                "number",
                ["number", "number"],
                [a, b]
              );
              console.log(result);

              result = addNums(a, b);
              console.log(result);
            }
          </script>
          <input type="number" id="a" />
          <input type="number" id="b" />
          <button onclick="run_wasm()">Add</button>
        </div>
      </div>
    </header>
    <div class="drawing-area">
      <canvas id="mapCanvas"></canvas>
      <p class="click-instruction">Click to create node</p>
    </div>
    <div class="path"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.3.1/gsap.min.js"></script>
    <script src="./gsap.js"></script>
    <script src="./script.js"></script>
  </body>
</html>
